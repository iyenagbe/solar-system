<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./digitalclock.css">
    <title>Digital Stopwatch Clock</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <p><span>Ray Dev</span></p>
            <h2>Digital clock With Stopwatch and Timer </h2>
            <p class="type">Clock</p>
        </div>

        <div class="outter-wrapper">
            <div class="clock">
                <div class="inner-wrapper">
                    <div class="main">
                        <div class="hour">
                            <p class="number" id="hour">00</p>
                            <p>Hours</p>
                        </div>

                        <p class="col"></p>
                        <div class="min">
                            <p class="number" id="min">00</p>
                            <p>Minutes</p>
                        </div>

                        <p class="col"></p>
                        <div class="sec">
                            <p class="number" id="sec">00</p>
                            <p>Seconds</p>
                        </div>

                        <p class="col"></p>
                        <div class="ampm">
                            <p class="number" id="ampm">AM</p>
                            <p class="other-ampm">PM</p>
                        </div>
                        <button class="btn"> Stopwatch</button>
                        <button class="btn"> Timer</button>
                    </div>

                    
                </div>
            </div>
        </div>

    </div>




    <script src="./digitalclock.js"></script>
</body>
</html>
